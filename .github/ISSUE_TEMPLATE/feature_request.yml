name: Feature request
description: Suggest an improvement or new capability for Quentangled.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem or use case your suggestion would address.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what you are trying to do and what is currently difficult or missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the solution you'd like
      description: Explain the behavior or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have considered.
    validations:
      required: false
